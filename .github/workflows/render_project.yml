name: Render Quarto Project

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for pushing back to repo
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: "https://cloud.r-project.org"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 3. Set up dependencies
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: deps::., any::sessioninfo
          dependencies: all
          upgrade: false

      # 4. Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # 5. Render the Quarto project and publish to GitHub Pages
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Commit any updates to analysis cache (e.g., _freeze/)
      - name: Commit and push cache updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _freeze/
          git diff --staged --quiet || git commit -m "Update analysis cache"
          git push
        continue-on-error: true
